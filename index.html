<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ♡</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: "Times New Roman", Times, serif;
    background: #f5bdcd;
}


/* =========================================================
   BACKGROUND - BẦU TRỜI HỒNG
========================================================= */

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #efa9bf 0%,
            #f5bfd0 25%,
            #f8d0d2 52%,
            #eab1bd 75%,
            #c98196 100%
        );
}


/* =========================================================
   ÁNH SÁNG
========================================================= */

.light {
    position: absolute;

    width: 650px;
    height: 650px;

    left: 50%;
    top: 37%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.42) 0%,
            rgba(255,225,235,.2) 40%,
            transparent 72%
        );

    filter: blur(10px);

    animation: lightPulse 7s ease-in-out infinite;

    pointer-events: none;
}

@keyframes lightPulse {

    0%, 100% {
        opacity: .65;
        transform: translate(-50%, -50%) scale(.95);
    }

    50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
    }
}


/* =========================================================
   MẶT TRỜI
========================================================= */

.sun {
    position: absolute;

    width: 125px;
    height: 125px;

    top: 11%;
    right: 13%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff7e7 0%,
            #ffe2c5 45%,
            #f6b3b5 100%
        );

    box-shadow:
        0 0 50px rgba(255,230,210,.6),
        0 0 100px rgba(255,190,205,.3);

    animation: sunFloat 8s ease-in-out infinite;
}

@keyframes sunFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(8px);
    }
}


/* =========================================================
   MÂY
========================================================= */

.cloud {
    position: absolute;

    width: 190px;
    height: 42px;

    border-radius: 100px;

    background: rgba(255,255,255,.45);

    filter: blur(1px);

    opacity: .7;

    animation: cloudMove linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    background: rgba(255,255,255,.45);
}

.cloud::before {
    width: 80px;
    height: 80px;

    left: 25px;
    bottom: 5px;
}

.cloud::after {
    width: 105px;
    height: 105px;

    left: 85px;
    bottom: 2px;
}

.cloud.one {
    top: 17%;
    left: -250px;

    animation-duration: 55s;
}

.cloud.two {
    top: 30%;
    left: -350px;

    transform: scale(.65);

    opacity: .35;

    animation-duration: 80s;
}

@keyframes cloudMove {

    from {
        margin-left: 0;
    }

    to {
        margin-left: calc(100vw + 600px);
    }
}


/* =========================================================
   ĐỒI PHÍA XA
========================================================= */

.hill-back {
    position: absolute;

    left: -10%;
    bottom: 27%;

    width: 120%;
    height: 260px;

    background: #d49aa8;

    border-radius: 50% 50% 0 0;

    opacity: .55;
}

.hill-front {
    position: absolute;

    left: -15%;
    bottom: 22%;

    width: 130%;
    height: 210px;

    background: #b9798b;

    border-radius: 50% 50% 0 0;

    opacity: .75;
}


/* =========================================================
   KHU VƯỜN
========================================================= */

.garden {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 43%;

    background:
        linear-gradient(
            180deg,
            #9b6875 0%,
            #744855 100%
        );

    z-index: 4;
}


/* =========================================================
   CON ĐƯỜNG
========================================================= */

.path {
    position: absolute;

    left: 50%;
    bottom: -10%;

    width: 260px;
    height: 65%;

    transform: translateX(-50%);

    background:
        linear-gradient(
            90deg,
            #dfb4ad,
            #f0d0c6,
            #dfb4ad
        );

    clip-path:
        polygon(
            43% 0,
            57% 0,
            100% 100%,
            0 100%
        );

    opacity: .95;

    z-index: 5;
}


/* =========================================================
   BỤI HOA
========================================================= */

.flower-bed {
    position: absolute;

    bottom: 0;

    width: 35%;
    height: 38%;

    z-index: 8;
}

.flower-bed.left {
    left: -2%;
}

.flower-bed.right {
    right: -2%;
}


/* =========================================================
   HOA
========================================================= */

.flower {
    position: absolute;

    width: 45px;
    height: 45px;

    animation: flowerSway 4s ease-in-out infinite;

    transform-origin: bottom center;
}

.flower .petal {
    position: absolute;

    width: 23px;
    height: 32px;

    left: 10px;
    top: 2px;

    border-radius: 70% 30% 70% 30%;

    background:
        linear-gradient(
            135deg,
            #fff0f4,
            var(--pink)
        );

    box-shadow:
        inset -3px -5px 7px rgba(130,40,65,.12);
}

.flower .p1 {
    transform: rotate(0deg);
}

.flower .p2 {
    transform: rotate(72deg);
}

.flower .p3 {
    transform: rotate(144deg);
}

.flower .p4 {
    transform: rotate(216deg);
}

.flower .p5 {
    transform: rotate(288deg);
}

.flower .core {
    position: absolute;

    width: 10px;
    height: 10px;

    left: 17px;
    top: 15px;

    border-radius: 50%;

    background: #f3c15c;

    z-index: 5;
}

.flower .stem {
    position: absolute;

    width: 4px;
    height: 85px;

    left: 21px;
    top: 37px;

    background: #536b4d;

    border-radius: 10px;

    z-index: -1;
}

@keyframes flowerSway {

    0%, 100% {
        transform: rotate(-2deg);
    }

    50% {
        transform: rotate(3deg);
    }
}


/* =========================================================
   TEXT CHÍNH
========================================================= */

.content {
    position: absolute;

    z-index: 30;

    left: 50%;
    top: 43%;

    width: min(900px, 90%);

    transform: translate(-50%, -50%);

    text-align: center;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.intro {
    font-family:
        "Times New Roman",
        Times,
        serif;

    font-size:
        clamp(12px, 1.5vw, 16px);

    font-style: italic;

    letter-spacing: 4px;

    color: rgba(88,47,60,.68);

    margin-bottom: 25px;

    opacity: 0;

    animation:
        introAppear 2s ease forwards;

    animation-delay: 1.2s;
}

.message {
    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style: italic;

    font-weight: normal;

    font-size:
        clamp(34px, 5.5vw, 70px);

    line-height: 1.25;

    color: #633b49;

    text-shadow:
        0 2px 0 rgba(255,255,255,.4);

    opacity: 0;

    animation:
        messageAppear 2.5s ease forwards;

    animation-delay: 2s;
}

@keyframes introAppear {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes messageAppear {

    from {
        opacity: 0;
        transform: translateY(25px);
        filter: blur(4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}


/* =========================================================
   HAI NÚT
========================================================= */

.buttons {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 18px;

    margin-top: 38px;

    opacity: 0;

    animation:
        buttonsAppear 2s ease forwards;

    animation-delay: 3.8s;
}

.buttons button {
    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style: italic;

    font-size: 18px;

    padding: 13px 31px;

    border-radius: 30px;

    cursor: pointer;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;

    -webkit-tap-highlight-color: transparent;
}

#yesBtn {
    color: white;

    border: none;

    background:
        linear-gradient(
            135deg,
            #d96f8b,
            #b94f70
        );

    box-shadow:
        0 8px 25px rgba(150,60,90,.25);
}

#yesBtn:hover {
    transform:
        translateY(-4px)
        scale(1.04);

    box-shadow:
        0 12px 30px rgba(150,60,90,.35);
}

#noBtn {
    color: #805363;

    border:
        1px solid rgba(130,70,90,.15);

    background:
        rgba(255,255,255,.7);

    position: relative;
}

@keyframes buttonsAppear {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   MÀN HÌNH SAU KHI ĐỒNG Ý
========================================================= */

.success {
    position: absolute;

    z-index: 100;

    left: 50%;
    top: 50%;

    width: min(750px, 90%);

    text-align: center;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(.85);

    pointer-events: none;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

.success.show {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);

    pointer-events: auto;
}

.success-flower {
    font-size: 65px;

    margin-bottom: 15px;

    animation:
        flowerBounce 2s ease-in-out infinite;
}

@keyframes flowerBounce {

    0%, 100% {
        transform:
            translateY(0)
            rotate(-3deg);
    }

    50% {
        transform:
            translateY(-10px)
            rotate(3deg);
    }
}

.success-title {
    font-family:
        "Times New Roman",
        Times,
        serif;

    font-size:
        clamp(40px, 6vw, 72px);

    font-style: italic;

    color: #633b49;

    margin-bottom: 20px;
}

.success-text {
    font-family:
        "Times New Roman",
        Times,
        serif;

    font-size:
        clamp(18px, 2.5vw, 27px);

    font-style: italic;

    line-height: 1.6;

    color: #704754;
}


/* =========================================================
   BƯỚM
========================================================= */

.butterfly {
    position: absolute;

    z-index: 25;

    width: 18px;
    height: 18px;

    animation:
        butterflyMove 14s ease-in-out infinite;
}

.butterfly::before,
.butterfly::after {
    content: "";

    position: absolute;

    width: 14px;
    height: 20px;

    background:
        linear-gradient(
            135deg,
            #fff2f5,
            #e88ca5
        );

    border-radius:
        80% 20% 80% 20%;
}

.butterfly::before {
    transform: rotate(25deg);
}

.butterfly::after {
    left: 10px;

    transform: rotate(-25deg);
}

.butterfly.one {
    left: 18%;
    bottom: 35%;

    animation-delay: 1s;
}

.butterfly.two {
    right: 20%;
    bottom: 45%;

    transform: scale(.7);

    animation-delay: 5s;
}

@keyframes butterflyMove {

    0% {
        transform:
            translate(0,0)
            rotate(-5deg);
    }

    25% {
        transform:
            translate(60px,-40px)
            rotate(8deg);
    }

    50% {
        transform:
            translate(120px,10px)
            rotate(-5deg);
    }

    75% {
        transform:
            translate(50px,50px)
            rotate(8deg);
    }

    100% {
        transform:
            translate(0,0)
            rotate(-5deg);
    }
}


/* =========================================================
   HẠT SÁNG
========================================================= */

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #fff6f8;

    box-shadow:
        0 0 10px #fff;

    opacity: .5;

    z-index: 20;

    animation:
        particleFloat 7s ease-in-out infinite;
}

@keyframes particleFloat {

    0%, 100% {
        transform: translateY(0);
        opacity: .2;
    }

    50% {
        transform: translateY(-35px);
        opacity: .8;
    }
}


/* =========================================================
   HOA RƠI SAU KHI ĐỒNG Ý
========================================================= */

.celebration-petal {
    position: fixed;

    top: -50px;

    z-index: 200;

    pointer-events: none;

    font-size: 20px;

    animation:
        petalFall linear forwards;
}

@keyframes petalFall {

    from {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;
    }

    to {
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;
    }
}


/* =========================================================
   LỚP TỐI NHẸ Ở ĐÁY
========================================================= */

.bottom-fade {
    position: absolute;

    z-index: 40;

    bottom: 0;

    width: 100%;
    height: 18%;

    background:
        linear-gradient(
            to top,
            rgba(55,29,38,.25),
            transparent
        );

    pointer-events: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .sun {
        width: 85px;
        height: 85px;

        right: 10%;
    }

    .garden {
        height: 39%;
    }

    .path {
        width: 180px;
    }

    .content {
        top: 42%;
    }

    .message {
        font-size:
            clamp(30px, 8.5vw, 44px);

        line-height: 1.3;
    }

    .intro {
        font-size: 11px;

        letter-spacing: 3px;
    }

    .buttons {
        gap: 12px;

        margin-top: 30px;
    }

    .buttons button {
        font-size: 16px;

        padding:
            11px 23px;
    }

    .flower-bed {
        transform: scale(.7);

        transform-origin:
            bottom center;
    }

    .success-title {
        font-size: 42px;
    }

    .success-text {
        font-size: 19px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     TOÀN BỘ KHUNG CẢNH
===================================================== -->

<div class="scene">


    <!-- Ánh sáng -->
    <div class="light"></div>


    <!-- Mặt trời -->
    <div class="sun"></div>


    <!-- Mây -->
    <div class="cloud one"></div>
    <div class="cloud two"></div>


    <!-- Đồi -->
    <div class="hill-back"></div>
    <div class="hill-front"></div>


    <!-- Khu vườn -->
    <div class="garden"></div>


    <!-- Con đường -->
    <div class="path"></div>


    <!-- =================================================
         HOA BÊN TRÁI
    ================================================== -->

    <div class="flower-bed left">

        <div class="flower"
             style="left:4%;bottom:20%;--pink:#df7892;">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>

            <div class="core"></div>
            <div class="stem"></div>

        </div>


        <div class="flower"
             style="left:25%;bottom:5%;--pink:#ef9eb1;">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>

            <div class="core"></div>
            <div class="stem"></div>

        </div>


        <div class="flower"
             style="left:48%;bottom:17%;--pink:#f3b6c5;">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>

            <div class="core"></div>
            <div class="stem"></div>

        </div>

    </div>


    <!-- =================================================
         HOA BÊN PHẢI
    ================================================== -->

    <div class="flower-bed right">

        <div class="flower"
             style="left:12%;bottom:12%;--pink:#f1a5b7;">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>

            <div class="core"></div>
            <div class="stem"></div>

        </div>


        <div class="flower"
             style="left:38%;bottom:22%;--pink:#dc718d;">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>

            <div class="core"></div>
            <div class="stem"></div>

        </div>


        <div class="flower"
             style="left:70%;bottom:5%;--pink:#f2bac7;">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>

            <div class="core"></div>
            <div class="stem"></div>

        </div>

    </div>


    <!-- =================================================
         BƯỚM
    ================================================== -->

    <div class="butterfly one"></div>
    <div class="butterfly two"></div>


    <!-- =================================================
         HẠT SÁNG
    ================================================== -->

    <div class="particle"
         style="left:18%;top:35%;animation-delay:1s;">
    </div>

    <div class="particle"
         style="left:29%;top:22%;animation-delay:3s;">
    </div>

    <div class="particle"
         style="left:72%;top:34%;animation-delay:2s;">
    </div>

    <div class="particle"
         style="left:83%;top:25%;animation-delay:4s;">
    </div>

    <div class="particle"
         style="left:55%;top:28%;animation-delay:1.5s;">
    </div>


    <!-- =================================================
         CÂU HỎI
    ================================================== -->

    <div class="content" id="questionBox">

        <div class="intro">
            một câu hỏi nhỏ dành cho em
        </div>

        <div class="message">
            Em làm người yêu anh nhé?
        </div>

        <div class="buttons">

            <button id="yesBtn">
                Em đồng ý
            </button>

            <button id="noBtn">
                Không
            </button>

        </div>

    </div>


    <!-- =================================================
         SAU KHI ĐỒNG Ý
    ================================================== -->

    <div class="success" id="successBox">

        <div class="success-flower">
            🌷
        </div>

        <div class="success-title">
            Giờ em đã là người yêu anh ràu ♡
        </div>

        <div class="success-text">
           Đừng hòng chạy đi đâu nữa nghen<br>
           </div>

    </div>


    <!-- Lớp tối phía dưới -->
    <div class="bottom-fade"></div>


</div>


<script>

/* =========================================================
   LẤY CÁC PHẦN TỬ
========================================================= */

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const questionBox =
    document.getElementById("questionBox");

const successBox =
    document.getElementById("successBox");


/* =========================================================
   NÚT "KHÔNG" - CHẠY TRỐN
========================================================= */

let noButtonMoved = false;


/*
    Hàm di chuyển nút Không
*/

function escapeNoButton() {

    const padding = 20;

    const buttonWidth =
        noBtn.offsetWidth;

    const buttonHeight =
        noBtn.offsetHeight;


    /*
        Lấy vùng an toàn để nút không
        chạy ra ngoài màn hình
    */

    const maxX =
        window.innerWidth
        - buttonWidth
        - padding;

    const maxY =
        window.innerHeight
        - buttonHeight
        - padding;


    /*
        Không cho nút nằm quá sát mép
    */

    const minX = padding;
    const minY = padding;


    /*
        Tạo vị trí ngẫu nhiên
    */

    const x =
        minX +
        Math.random() *
        Math.max(1, maxX - minX);

    const y =
        minY +
        Math.random() *
        Math.max(1, maxY - minY);


    /*
        Chuyển sang fixed để có thể
        chạy khắp màn hình
    */

    noBtn.style.position = "fixed";

    noBtn.style.left =
        x + "px";

    noBtn.style.top =
        y + "px";

    noBtn.style.zIndex = "999";


    /*
        Hiệu ứng nhỏ khi chạy
    */

    noBtn.style.transform =
        "scale(.92) rotate(" +
        (Math.random() * 10 - 5) +
        "deg)";


    setTimeout(function() {

        noBtn.style.transform =
            "scale(1) rotate(0deg)";

    }, 180);


    noButtonMoved = true;
}


/* =========================================================
   MÁY TÍNH - CHUỘT ĐẾN GẦN LÀ CHẠY
========================================================= */

noBtn.addEventListener(
    "mouseenter",
    function() {

        escapeNoButton();

    }
);


/* =========================================================
   ĐIỆN THOẠI - CHẠM VÀO LÀ CHẠY
========================================================= */

noBtn.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        escapeNoButton();

    },
    {
        passive: false
    }
);


/* =========================================================
   PHÒNG TRƯỜNG HỢP CLICK ĐƯỢC
========================================================= */

noBtn.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        escapeNoButton();

    }
);


/* =========================================================
   NÚT "EM ĐỒNG Ý"
========================================================= */

yesBtn.addEventListener(
    "click",
    function() {


        /*
            Làm mờ câu hỏi
        */

        questionBox.style.opacity = "0";

        questionBox.style.transform =
            "translate(-50%, -50%) scale(.9)";

        questionBox.style.pointerEvents =
            "none";


        /*
            Sau một khoảng ngắn,
            hiện lời nhắn
        */

        setTimeout(
            function() {

                successBox.classList.add("show");

                createPetals();

            },
            700
        );

    }
);


/* =========================================================
   TẠO HOA RƠI
========================================================= */

function createPetals() {

    const symbols = [
        "🌸",
        "🌷",
        "✿",
        "❀"
    ];


    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const petal =
            document.createElement("div");


        petal.className =
            "celebration-petal";


        petal.innerHTML =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        /*
            Vị trí ban đầu
        */

        petal.style.left =
            Math.random() * 100 + "vw";


        /*
            Kích thước
        */

        petal.style.fontSize =
            (12 + Math.random() * 18) + "px";


        /*
            Thời gian rơi
        */

        petal.style.animationDuration =
            (4 + Math.random() * 4) + "s";


        /*
            Delay
        */

        petal.style.animationDelay =
            Math.random() * 1.5 + "s";


        document.body.appendChild(
            petal
        );


        /*
            Xóa sau khi animation xong
        */

        setTimeout(
            function() {

                petal.remove();

            },
            8000
        );

    }
}


/* =========================================================
   NGĂN DOUBLE-TAP ZOOM TRÊN MOBILE
========================================================= */

document.addEventListener(
    "touchstart",
    function() {},
    {
        passive: true
    }
);


/* =========================================================
   KHI XOAY MÀN HÌNH
========================================================= */

window.addEventListener(
    "resize",
    function() {

        /*
            Nếu nút Không đã chạy ra ngoài
            thì đưa nó về vị trí hợp lệ
        */

        if (noButtonMoved) {

            const rect =
                noBtn.getBoundingClientRect();

            const maxX =
                window.innerWidth -
                rect.width -
                15;

            const maxY =
                window.innerHeight -
                rect.height -
                15;


            if (rect.left > maxX) {

                noBtn.style.left =
                    Math.max(15, maxX) + "px";

            }

            if (rect.top > maxY) {

                noBtn.style.top =
                    Math.max(15, maxY) + "px";

            }

        }

    }
);

</script>
